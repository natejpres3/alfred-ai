name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env: {POSTGRES_USER: academy, POSTGRES_PASSWORD: academy, POSTGRES_DB: academy_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run: {working-directory: backend}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - name: Build sandbox image (enables the Docker isolation test)
        run: docker build -t ai-academy-sandbox:latest sandbox
      - name: Tests (SQLite)
        run: uv run pytest -q
      - name: Tests (Postgres)
        run: uv run pytest -q
        env: {TEST_DATABASE_URL: "postgresql+psycopg://academy:academy@localhost:5432/academy_test"}
      - name: Migrations apply on Postgres
        run: uv run alembic upgrade head && uv run alembic check
        env: {DATABASE_URL: "postgresql+psycopg://academy:academy@localhost:5432/academy_test"}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build
