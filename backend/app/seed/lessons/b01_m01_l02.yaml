lesson_key: b01.m01.l02
title: Matrix multiplication and linear transformations
subtitle: A matrix is a function — and a neural-network layer is one
summary: >-
  A matrix–vector product is a stack of dot products, and also a weighted sum of the matrix's columns. Reading
  the columns as "where the basis vectors land" turns every matrix into a geometric transformation, and matrix
  multiplication into function composition.
why_it_matters: >-
  A dense layer computes y = Wx + b. Attention computes QKᵀ. GPU performance work is largely about computing
  matrix products fast. You cannot reason about shapes, layers or kernels without fluency here.
explanation_strategy: two-views (rows as dot products, columns as basis images) with geometry
estimated_minutes: 60
prerequisites: [la.scalars_vectors, la.dot_product]
objectives:
  - {id: b01.m01.l02.o1, concept_key: la.matmul, critical: true, bloom: apply, statement: "Compute matrix products, determine when they are defined, and read entry (i,j) as a dot product"}
  - {id: b01.m01.l02.o2, concept_key: la.linear_maps, critical: true, bloom: understand, statement: "Interpret a matrix as a linear transformation via where it sends the basis vectors"}
  - {id: b01.m01.l02.o3, concept_key: la.matmul, critical: false, bloom: analyze, statement: "Explain composition, non-commutativity, and why a neural-network layer is a matrix multiply"}
  - {id: b01.m01.l02.o4, concept_key: la.matrices, critical: false, bloom: remember, statement: "Use transpose, identity and shape reasoning correctly"}
connections:
  - {concept_key: la.dot_product, direction: builds_on, note: "Each output entry is a dot product of a row with the input."}
  - {concept_key: calc.matrix_calculus, direction: leads_to, note: "The Jacobian of x ↦ Wx is W itself."}
