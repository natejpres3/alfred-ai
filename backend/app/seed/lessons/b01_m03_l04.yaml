lesson_key: b01.m03.l04
title: Gradient descent and optimization
subtitle: Learning is walking downhill on a loss surface
summary: >-
  Gradient descent repeatedly steps opposite the gradient: θ ← θ − η∇L(θ). It follows directly from the
  first-order Taylor approximation. The learning rate η controls everything: too small is slow, too large
  oscillates or diverges, and the threshold is set by the curvature of the loss.
why_it_matters: >-
  Essentially every neural network — including every large language model — is trained by a variant of gradient
  descent (SGD, momentum, Adam). Understanding why it works and how it fails is what lets you debug training runs
  instead of guessing hyperparameters.
explanation_strategy: derive-from-taylor then analyze the 1-D quadratic exactly
estimated_minutes: 60
prerequisites: [calc.partial_gradients, la.norms, calc.derivatives]
objectives:
  - {id: b01.m03.l04.o1, concept_key: opt.gradient_descent, critical: true, bloom: apply, statement: "Derive the gradient descent update from the first-order Taylor approximation and perform updates by hand"}
  - {id: b01.m03.l04.o2, concept_key: opt.learning_rate, critical: true, bloom: analyze, statement: "Explain how the learning rate affects convergence, oscillation and divergence"}
  - {id: b01.m03.l04.o3, concept_key: opt.gradient_descent, critical: false, bloom: understand, statement: "Describe local minima, saddle points and stopping criteria"}
connections:
  - {concept_key: calc.partial_gradients, direction: builds_on, note: "−∇L is the direction of steepest descent."}
  - {concept_key: opt.sgd, direction: leads_to, note: "Stochastic gradient descent replaces ∇L with a cheap, noisy estimate."}
  - {concept_key: calc.taylor, direction: leads_to, note: "Second-order Taylor (the Hessian) explains the learning-rate limit in many dimensions."}
