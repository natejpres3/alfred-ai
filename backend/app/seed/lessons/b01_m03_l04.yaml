variant_bank:
  - id: v1
    type: numeric
    category: math
    critical: true
    prompt: "One step of gradient descent on $L(w)=w^2$ from $w_0=4$ with $\\eta=0.25$. What is $w_1$?"
    objective_ids: [b01.m03.l04.o1]
    grading:
      numeric: {value: 2, abs_tol: 0.000001, rel_tol: 0}
      explanation: "4 − 0.25·8 = 2."
  - id: v2
    type: short_answer
    category: conceptual
    critical: true
    points: 3
    prompt: "Why is there a minus sign in $\\theta \\leftarrow \\theta - \\eta\\nabla L$? What would happen with a plus sign, and why?"
    objective_ids: [b01.m03.l04.o1]
    grading:
      rubric:
        criteria:
          - {id: c1, points: 1, required_for_mastery: true, description: "The gradient points in the direction of steepest increase of L"}
          - {id: c2, points: 1, required_for_mastery: true, description: "Subtracting it moves in the direction of steepest decrease, lowering the loss"}
          - {id: c3, points: 1, required_for_mastery: false, description: "A plus sign would increase the loss (gradient ascent)"}
        reference_answer: "∇L points uphill; −∇L points downhill, so subtracting decreases L (first-order change −η|∇L|²). A plus sign performs gradient ascent and increases the loss."
        common_misconceptions: []
      explanation: "Descent vs ascent."
  - id: v3
    type: numeric
    category: math
    critical: true
    prompt: "Gradient descent on $L(w)=(w-1)^2$ from $w_0=0$ with $\\eta=0.75$. What is $w_1$?"
    objective_ids: [b01.m03.l04.o2]
    grading:
      numeric: {value: 1.5, abs_tol: 0.000001, rel_tol: 0}
      explanation: "0 − 0.75·2·(−1) = 1.5: it overshoots the minimum at 1 (η = 0.75 is between 1/a = 0.5 and 2/a = 1, so it oscillates but converges)."
  - id: v4
    type: short_answer
    category: conceptual
    critical: true
    points: 3
    prompt: |
      Your training loss goes 2.3, 1.9, 2.6, 4.8, 11.2, … What is the most likely cause, what would you change,
      and why does that fix it?
    objective_ids: [b01.m03.l04.o2]
    grading:
      rubric:
        criteria:
          - {id: c1, points: 1, required_for_mastery: true, description: "Diagnoses a learning rate that is too large (divergence)"}
          - {id: c2, points: 1, required_for_mastery: true, description: "Recommends reducing the learning rate"}
          - {id: c3, points: 1, required_for_mastery: false, description: "Explains: steps overshoot beyond the region where the linear approximation holds / exceed the 2/curvature limit, so each step increases the loss"}
        reference_answer: "The loss is growing exponentially: the learning rate exceeds the stability limit (about 2/curvature), so each step overshoots and lands higher. Reduce the learning rate."
        common_misconceptions: ["Train longer", "Increase the learning rate to escape"]
      explanation: "Divergence → lower η."
