lesson_key: b01.m03.l05
title: Implementing gradient descent from scratch
subtitle: Linear regression, vectorized gradients, and checking your own math
summary: >-
  Put the previous four lessons together: represent data as a matrix, define mean squared error, derive its
  gradient with the chain rule in vectorized form, verify it numerically, and train with gradient descent.
  Feature scaling turns out to be a learning-rate problem in disguise.
why_it_matters: >-
  This exact loop — forward pass, loss, gradient, update, monitor — is how every neural network is trained. The
  habits you build here (shape checking, gradient checking, reading loss curves) are the ones that save days of
  debugging later.
explanation_strategy: build-it end-to-end with shape-driven derivation
estimated_minutes: 60
prerequisites: [opt.gradient_descent, la.matmul, calc.chain_rule]
objectives:
  - {id: b01.m03.l05.o1, concept_key: opt.gd_implementation, critical: true, bloom: apply, statement: "Derive the mean-squared-error gradient for linear regression in vectorized form"}
  - {id: b01.m03.l05.o2, concept_key: opt.gd_implementation, critical: true, bloom: create, statement: "Implement batch gradient descent in NumPy and verify it with a numerical gradient check"}
  - {id: b01.m03.l05.o3, concept_key: opt.gd_implementation, critical: false, bloom: analyze, statement: "Diagnose training problems from a loss curve"}
connections:
  - {concept_key: opt.learning_rate, direction: builds_on, note: "Unscaled features create curvature imbalance, which limits the learning rate."}
  - {concept_key: stats.mle, direction: leads_to, note: "Minimizing MSE is maximum likelihood under Gaussian noise."}
  - {concept_key: opt.sgd, direction: leads_to, note: "Replace the full-batch gradient with minibatch estimates."}
