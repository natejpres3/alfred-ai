lesson_key: b01.m01.l01
title: Vectors, dot products, and geometric intuition
subtitle: The single operation that sits underneath similarity search, neural layers and attention
summary: >-
  Vectors are both arrows and lists of numbers. The dot product connects the two views: algebraically it is a
  sum of products, geometrically it measures how much two vectors point the same way. Norms and cosine
  similarity follow directly.
why_it_matters: >-
  Every neuron computes a dot product between its weights and its input. Embedding search ranks documents by
  cosine similarity. Transformer attention scores are dot products between queries and keys. If you understand
  this one operation geometrically, a large fraction of modern AI becomes readable.
explanation_strategy: geometric-first with worked numeric examples
estimated_minutes: 60
prerequisites: []
objectives:
  - {id: b01.m01.l01.o1, concept_key: la.scalars_vectors, critical: false, bloom: understand, statement: "Represent data as vectors and distinguish scalars, vectors, matrices and tensors by shape"}
  - {id: b01.m01.l01.o2, concept_key: la.dot_product, critical: true, bloom: apply, statement: "Compute the dot product algebraically and interpret it geometrically as |a||b|cos θ"}
  - {id: b01.m01.l01.o3, concept_key: la.norms, critical: true, bloom: analyze, statement: "Compute L1/L2 norms and cosine similarity, and explain when cosine similarity is preferable to Euclidean distance"}
connections:
  - {concept_key: la.matmul, direction: leads_to, note: "Every entry of a matrix product is a dot product (next lesson)."}
  - {concept_key: opt.gradient_descent, direction: leads_to, note: "Gradient descent moves along the direction with the most negative dot product with the gradient."}
