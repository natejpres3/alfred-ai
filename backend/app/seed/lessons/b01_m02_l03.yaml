    objective_ids: [b01.m02.l03.o2]
    grading:
      rubric:
        criteria:
          - {id: c1, points: 1, required_for_mastery: true, description: "dy/dx = (dy/du)(du/dx) = −6"}
          - {id: c2, points: 2, required_for_mastery: true, description: "Explains that a small change in x is scaled by 3 to become a change in u, which is then scaled by −2 to become a change in y: scalings compose by multiplication"}
        reference_answer: "dy/dx = −2 · 3 = −6. A nudge δx becomes 3δx in u, which becomes −2·3δx in y; successive scalings multiply."
        common_misconceptions: ["Adding rates (getting 1)"]
      explanation: "Rates compose multiplicatively."
  - id: v4
    type: short_answer
    category: conceptual
    critical: true
