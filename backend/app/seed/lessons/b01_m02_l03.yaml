lesson_key: b01.m02.l03
title: Derivatives, gradients, and the chain rule
subtitle: How a change in one number propagates to another — the mathematics of learning
summary: >-
  A derivative is the best local linear approximation of a function. The chain rule says the rate of change of a
  composition is the product of the local rates. A gradient collects all partial derivatives into a vector that
  points uphill fastest. These three ideas are all of backpropagation.
why_it_matters: >-
  Training a neural network means asking "if I nudge this weight, how does the loss change?" for millions of
  weights. Backpropagation answers that by applying the chain rule through a computational graph; gradient
  descent then steps against the gradient. Without these ideas, deep learning is a black box.
explanation_strategy: local-linear-approximation with computational graphs
estimated_minutes: 60
prerequisites: [la.scalars_vectors, la.dot_product]
objectives:
  - {id: b01.m02.l03.o1, concept_key: calc.derivatives, critical: true, bloom: apply, statement: "Explain the derivative as a local linear approximation and compute derivatives of common functions"}
  - {id: b01.m02.l03.o2, concept_key: calc.chain_rule, critical: true, bloom: apply, statement: "Apply the chain rule to composite functions and explain why it multiplies local rates of change"}
  - {id: b01.m02.l03.o3, concept_key: calc.partial_gradients, critical: true, bloom: understand, statement: "Compute partial derivatives and gradients, and explain why the gradient points in the direction of steepest ascent"}
connections:
  - {concept_key: la.dot_product, direction: builds_on, note: "The directional derivative is a dot product: ∇f · u."}
  - {concept_key: opt.gradient_descent, direction: leads_to, note: "Next lesson: step in the direction −∇f."}
  - {concept_key: calc.matrix_calculus, direction: leads_to, note: "Jacobians generalize the chain rule to vector-valued functions."}
