        criteria:
          - {id: c1, points: 1, required_for_mastery: true, description: "∇f = (3, 4)"}
          - {id: c2, points: 1, required_for_mastery: true, description: "Steepest direction (3,4)/5 = (0.6, 0.8), because the directional derivative ∇f·u is maximized when u is parallel to ∇f"}
